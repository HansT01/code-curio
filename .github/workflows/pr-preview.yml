name: PR Preview

# Note: secrets aren't available to `pull_request` runs from forks (GitHub's default
# safety behavior), so preview deploys only work for PRs from branches within this repo.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKER_NAME: code-curio-pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://code-curio-pr-${{ github.event.pull_request.number }}.hans-teh.workers.dev/curio/p2p-group-chat

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Deploys to its own Worker name, so it gets its own isolated Durable Object -
      # separate chat/signaling state from production, safe to test against.
      # (pnpm doesn't cleanly forward extra flags through a compound "build && deploy"
      # script, so build and deploy are run as separate steps instead.)
      - run: pnpm exec wrangler deploy --config .output/server/wrangler.json --name "$WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->'
            const body = `${marker}\n🚀 Preview deployed: ${process.env.PREVIEW_URL}\n\nIsolated Worker + Durable Object, deleted automatically when this PR closes.`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body })
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler delete "$WORKER_NAME" --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->'
            const body = `${marker}\n🗑️ Preview Worker deleted (PR closed).`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            }
